name: Feature Request
description: Suggest a new feature
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 🚀 Feature Summary
      description: What do you want to add?
      placeholder: Describe the feature
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 💡 Motivation
      description: Why is this useful?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 🧠 Proposed Solution
      description: If you have ideas on how to implement it
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives
      description: Other approaches considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 📎 Additional Context
    validations:
      required: false