name: Bug Report
description: Report a bug or unexpected behavior
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 🐛 Description
      description: What happened?
      placeholder: Describe the bug in detail
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 🖥️ Operating System
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 22.04
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 📦 App Version
      placeholder: e.g. v1.2.0
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 📎 Additional Context
      description: Logs, screenshots, or anything else
    validations:
      required: false